<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dots" x="0" y="0" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B3A5C"/>
      <stop offset="100%" stop-color="#142B44"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Logo badge top-left -->
  <g transform="translate(80, 80)">
    <circle cx="36" cy="36" r="36" fill="#D6EBF5"/>
    <g transform="translate(26, 24) scale(2.2)">
      <path d="M9 1 C9 1, 1 10, 1 15 A8 8 0 0 0 17 15 C17 10, 9 1, 9 1 Z" fill="#1B3A5C"/>
      <path d="M5.5 14 A3.5 3.5 0 0 0 9 17.5" stroke="#F28C28" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>
    <text x="92" y="48" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="0.5">Uniacque</text>
  </g>

  <!-- Warm accent bar -->
  <rect x="80" y="260" width="90" height="8" rx="4" fill="#F28C28"/>

  <!-- Main title -->
  <text x="80" y="360" font-family="Helvetica, Arial, sans-serif" font-size="110" font-weight="800" fill="#ffffff" letter-spacing="-1">Scuole</text>

  <!-- Subtitle -->
  <text x="80" y="430" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#A9D9EC">Il portale didattico di Uniacque</text>

  <!-- Area chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff">
    <g transform="translate(80, 500)">
      <rect width="180" height="52" rx="26" fill="#ffffff" fill-opacity="0.12" stroke="#A9D9EC" stroke-opacity="0.4"/>
      <text x="90" y="33" text-anchor="middle">Educational</text>
    </g>
    <g transform="translate(276, 500)">
      <rect width="190" height="52" rx="26" fill="#ffffff" fill-opacity="0.12" stroke="#A9D9EC" stroke-opacity="0.4"/>
      <text x="95" y="33" text-anchor="middle">Water School</text>
    </g>
    <g transform="translate(482, 500)">
      <rect width="210" height="52" rx="26" fill="#ffffff" fill-opacity="0.12" stroke="#A9D9EC" stroke-opacity="0.4"/>
      <text x="105" y="33" text-anchor="middle">Area didattica</text>
    </g>
  </g>

  <!-- Decorative water drop right side -->
  <g transform="translate(900, 180)" opacity="0.9">
    <path d="M120 20 C120 20, 20 140, 20 220 A100 100 0 0 0 220 220 C220 140, 120 20, 120 20 Z"
          fill="#A9D9EC" fill-opacity="0.25" stroke="#A9D9EC" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M60 200 A60 60 0 0 0 120 260"
          stroke="#F28C28" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
